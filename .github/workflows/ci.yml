name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install pytest==8.3.4
      - name: Pytest (auth, RBAC, stock transaction, audit)
        run: pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Build dashboard
        working-directory: frontend
        run: npm ci && npm run build

  node-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: node-service/package-lock.json}
      - name: Typecheck + tests (Hono, JWT/RBAC, idempotent confirm)
        working-directory: node-service
        run: |
          npm ci
          npm run build
          npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet
      - name: Build image
        run: docker build -f backend/Dockerfile -t business-flow-automator:ci .
      - name: Run container and verify demo login
        run: |
          docker run -d --name bfa-ci -p 8000:8000 business-flow-automator:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"login":"admin","password":"admin123"}' | grep -q access_token
          docker logs bfa-ci | tail -15
