services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - backend_data:/app/data
      - ./google-credentials.json:/app/google-credentials.json:ro  # ключ Google Sheets (опционально)
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

  # Полный стек с PostgreSQL: docker compose --profile full up
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_DB: business_flow
      POSTGRES_USER: bf
      POSTGRES_PASSWORD: bf_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  backend_data:
  pg_data:
