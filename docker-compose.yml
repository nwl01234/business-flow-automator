services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Telegram-бот поднимается отдельно: нужен BOT_TOKEN.
  # docker compose --profile bot up -d
  bot:
    profiles: ["bot"]
    build: ./bot
    env_file: .env
    environment:
      - API_PUBLIC_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Опциональный PostgreSQL: docker compose --profile full up -d
  # В .env задать DATABASE_URL=postgresql://bf:bf_pass@postgres:5432/business_flow
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_DB: business_flow
      POSTGRES_USER: bf
      POSTGRES_PASSWORD: bf_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  backend_data:
  pg_data:
